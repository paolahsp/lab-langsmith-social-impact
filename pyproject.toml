[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-impact-agent-eval"
version = "1.0.0"
description = "Custom LangSmith evaluation for an evidence-grounded social-impact consulting assistant"
requires-python = ">=3.10"
dependencies = [
  "langsmith>=0.8.16,<1",
  "openai>=1.61.1,<3",
  "openevals>=0.2.0,<0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
